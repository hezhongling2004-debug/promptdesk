name: Build preview
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install zstd
      - run: zsh release.sh --preview
      - uses: actions/upload-artifact@v4
        with:
          name: PromptDesk-macOS-universal-preview
          path: dist/*PREVIEW*
